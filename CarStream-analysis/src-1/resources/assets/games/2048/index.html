<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ghép số 2048</title>
<!--
  GHEP SO 2048 — 1 nguoi, vuot hoac bam nut huong.

  Luat: vuot mot huong thi ca ban don ve huong do, hai o BANG NHAU cham nhau thi
  nhap lam mot va cong doi. Moi luot don duoc thi hien them mot o moi (90% ra 2,
  10% ra 4). Het cho don la thua.

  Bon quy tac cua game HTML (xem md/app/tro-choi.md):

    1. Nap carstream-game.js dau tien, nghe onPause/onResume.
    2. Mau lay tu CarGame.theme. 2048 can 11 bac mau ma theme chi co 8 mau -
       nen bac mau o day la MOT mau cua theme phu DAN LEN nen, khong phai 11
       mau tu che. Doi bang mau app la ca game doi theo.
    3. O bam >= CarGame.TOUCH_MIN (60px) - ke ca nut huong.
    4. Ban co do CHIEU CAO quyet dinh. Ban 2048 vuong nen lay min(rong, cao):
       khung game rat ngang (1772x616) - tinh theo be ngang la ban tran xuong
       duoi mat.

  HAI CHO RIENG CUA MAN HINH XE:

  * PHAI CO NUT HUONG. Man hinh xe khong co ban phim, va vuot tren man cam ung
    trong xe hay bi doc thanh cham (tay dua ngang khi xe rung). Vuot van chay,
    nhung nut huong moi la duong chac. Ca hai cung goi move().

  * TRANG THAI DOI NGAY, HINH DOI SAU. O nhap duoc cong diem NGAY trong move();
    setTimeout chi lam mot viec la go cai the da truot chong len. WebView.onPause
    chan timer, nen neu de trang thai nam trong setTimeout thi roi man hinh giua
    luot la mat diem. flushPending() cung don not truoc moi luot va luc onResume.
-->
<script src="../carstream-game.js"></script>
<style>
  html, body {
    margin: 0; height: 100%;
    background: var(--bg, #201E1D); color: var(--text, #F9F4ED);
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 48px;
  }

  /* --cell / --gap do JS dat vao, xem layout(). */
  #board {
    position: relative;
    width: calc(4 * var(--cell) + 5 * var(--gap));
    height: calc(4 * var(--cell) + 5 * var(--gap));
    padding: var(--gap);
    box-sizing: border-box;
    border-radius: calc(var(--gap) * 1.4);
    background: var(--surface, #2E2B25);
    touch-action: none;              /* khong thi vuot bi doc thanh cuon trang */
  }
  #grid {
    position: absolute; inset: var(--gap);
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(4, var(--cell));
    grid-template-rows: repeat(4, var(--cell));
  }
  .hole { background: var(--bg, #201E1D); border-radius: calc(var(--gap) * 0.8); }

  #tiles { position: absolute; inset: var(--gap); }
  .tile {
    position: absolute; top: 0; left: 0;
    width: var(--cell); height: var(--cell);
    display: flex; align-items: center; justify-content: center;
    border-radius: calc(var(--gap) * 0.8);
    font-weight: 700; line-height: 1;
    transition: transform .11s ease-out;
  }
  .tile.new { animation: pop-in .16s ease-out; }
  .tile.pop { animation: pop .16s ease-out; }
  .tile.big { box-shadow: inset 0 0 0 3px var(--accent, #C67139); }
  @keyframes pop-in { from { transform: var(--at) scale(.4); opacity: 0; } }
  @keyframes pop { 50% { transform: var(--at) scale(1.14); } }

  #side { width: 300px; flex: none; }
  #scores { display: flex; gap: 12px; }
  .box {
    flex: 1; background: var(--surface, #2E2B25);
    border-radius: 14px; padding: 10px 14px;
  }
  .box b { display: block; font-size: 13px; font-weight: 600; color: var(--dim, #C0B6A5); }
  .box span { font-size: 26px; font-weight: 700; }
  #status { font-size: 17px; font-weight: 700; margin: 12px 0 4px; min-height: 24px; }

  /* Nut huong: 3 hang x 3 cot, o giua de trong. */
  #pad {
    margin-top: 8px;
    display: grid; gap: 8px;
    grid-template-columns: repeat(3, 1fr);
  }
  #pad button {
    min-height: 60px; border: 0; border-radius: 14px;
    background: var(--surface, #2E2B25); color: var(--text, #F9F4ED);
    font-size: 24px; cursor: pointer; touch-action: manipulation;
  }
  #pad button:active { background: var(--accent, #C67139); color: var(--bg, #201E1D); }
  #pad .gap { visibility: hidden; }
  #pad .up { grid-column: 2; }
  #pad .down { grid-column: 2; }

  #row { display: flex; gap: 12px; margin-top: 12px; }
  .btn {
    flex: 1; min-height: 60px; border: 0; border-radius: 999px;
    font-family: inherit; font-size: 18px; font-weight: 700;
    cursor: pointer; touch-action: manipulation;
  }
  #again { background: var(--accent, #C67139); color: var(--bg, #201E1D); }
  #again:hover { background: var(--accentSoft, #F6A06B); }
  #undo { background: var(--surface, #2E2B25); color: var(--text, #F9F4ED); }
  #undo:hover:not(:disabled) { background: var(--dim, #C0B6A5); color: var(--bg, #201E1D); }
  #undo:disabled { opacity: .4; cursor: default; }

  /* Khung hep (cua so trinh duyet luc lam game): bop bang ben cho ban co cho. */
  @media (max-width: 1100px) {
    #wrap { gap: 24px; }
    #side { width: 210px; }
    .box span { font-size: 21px; }
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="board">
    <div id="grid"></div>
    <div id="tiles"></div>
  </div>
  <div id="side">
    <div id="scores">
      <div class="box"><b>Điểm</b><span id="score">0</span></div>
      <div class="box"><b>Cao nhất</b><span id="best">0</span></div>
    </div>
    <div id="status"></div>
    <div id="pad">
      <button class="gap" type="button" tabindex="-1"></button>
      <button class="up" data-dir="up" type="button">▲</button>
      <button class="gap" type="button" tabindex="-1"></button>
      <button data-dir="left" type="button">◀</button>
      <button class="gap" type="button" tabindex="-1"></button>
      <button data-dir="right" type="button">▶</button>
      <button class="gap" type="button" tabindex="-1"></button>
      <button class="down" data-dir="down" type="button">▼</button>
      <button class="gap" type="button" tabindex="-1"></button>
    </div>
    <div id="row">
      <button id="again" class="btn" type="button">Ván mới</button>
      <button id="undo" class="btn" type="button">Hoàn tác</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CarGame = window.CarGame;
  var T = CarGame.theme;

  var N = 4;                          // ban 4x4, dung ban goc
  var MIN_CELL = CarGame.TOUCH_MIN;   // luat 3
  var MAX_CELL = 150;                 // man to thi khong phong to vo ich
  var ANIM = 130;                     // ms, hoi dai hon transition .11s
  var HISTORY = 50;                   // so buoc hoan tac giu lai
  var BEST_KEY = 'carstream.2048.best';

  var wrap = document.getElementById('wrap');
  var board = document.getElementById('board');
  var side = document.getElementById('side');
  var gridEl = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var statusEl = document.getElementById('status');
  var undoBtn = document.getElementById('undo');

  var grid = new Array(N * N).fill(null);   // o trong = null, con lai la the
  var tiles = [];                           // moi the: {v, r, c, el, merged}
  var history = [];                         // ban do + diem TRUOC moi luot
  var pending = [];                         // {el, tile} the da nhap, cho go
  var score = 0;
  var best = 0;
  var over = false;
  var reached = false;                      // da cham 2048 chua (chi bao mot lan)

  function clamp(lo, v, hi) { return Math.max(lo, Math.min(hi, v)); }
  function idx(r, c) { return r * N + c; }
  function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

  /* ---------------- mau: luat 2 ---------------- */

  // Doi mau app vao bien CSS, de ca file chi co MOT cho biet mau.
  for (var k in T) {
    if (Object.prototype.hasOwnProperty.call(T, k)) {
      document.documentElement.style.setProperty('--' + k, T[k]);
    }
  }

  function rgb(hex) {
    var h = parseInt(hex.slice(1), 16);
    return [(h >> 16) & 255, (h >> 8) & 255, h & 255];
  }
  var ACC = rgb(T.accent), ACC2 = rgb(T.accent2);

  /**
   * Mau mot o theo gia tri.
   *
   * 2..128 la cam dat dam dan, 256 tro len doi sang xanh reu - doi mau la de o
   * to nhan ra tu xa, khong phai de dep. Chu doi sang mau nen khi o du dam,
   * khong thi so chim vao mau o.
   */
  function tint(v) {
    var n = Math.round(Math.log(v) / Math.LN2);      // 2 -> 1, 4 -> 2, ...
    var base = (n <= 7) ? ACC : ACC2;
    // San 0.35 cho o 2: thap hon nua thi o 2 gan bang mau o trong, nhin qua
    // tren man xe la tuong ban con trong.
    var a = (n <= 7) ? Math.min(1, 0.24 + n * 0.11) : Math.min(1, 0.55 + (n - 8) * 0.15);
    return {
      bg: 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + a.toFixed(2) + ')',
      fg: (a >= 0.62) ? T.bg : T.text
    };
  }

  /* ---------------- ban co co theo khung: luat 4 ---------------- */

  function layout() {
    var wrapGap = parseFloat(getComputedStyle(wrap).columnGap) || 48;
    var availW = Math.max(240, window.innerWidth - side.offsetWidth - wrapGap - 32);
    var availH = Math.max(240, window.innerHeight - 32);
    var box = Math.min(availW, availH);              // ban 2048 vuong
    var gap = clamp(6, Math.round(box * 0.022), 14);
    var cell = clamp(MIN_CELL, Math.floor((box - gap * (N + 1)) / N), MAX_CELL);
    board.style.setProperty('--cell', cell + 'px');
    board.style.setProperty('--gap', gap + 'px');
    for (var i = 0; i < tiles.length; i++) { place(tiles[i]); }
  }

  function cellPx() { return parseFloat(getComputedStyle(board).getPropertyValue('--cell')); }
  function gapPx() { return parseFloat(getComputedStyle(board).getPropertyValue('--gap')); }

  /** Dat the vao dung o. Giu --at de keyframes phong to quanh dung cho do. */
  function place(t) {
    var step = cellPx() + gapPx();
    var at = 'translate(' + (t.c * step) + 'px,' + (t.r * step) + 'px)';
    t.el.style.setProperty('--at', at);
    t.el.style.transform = at;
  }

  function paint(t) {
    var s = tint(t.v);
    t.el.textContent = t.v;
    t.el.style.background = s.bg;
    t.el.style.color = s.fg;
    // So 4 chu thi phai thu lai, khong thi "1024" tran ra ngoai o.
    t.el.style.fontSize = 'calc(var(--cell) * ' + (String(t.v).length >= 4 ? 0.3 : 0.42) + ')';
    t.el.classList.toggle('big', t.v >= 2048);
  }

  /* ---------------- the ---------------- */

  function addTile(r, c, v, fresh) {
    var el = document.createElement('div');
    el.className = 'tile' + (fresh ? ' new' : '');
    var t = { v: v, r: r, c: c, el: el, merged: false };
    place(t);
    paint(t);
    tilesEl.appendChild(el);
    tiles.push(t);
    grid[idx(r, c)] = t;
    return t;
  }

  function dropTile(t) {
    var i = tiles.indexOf(t);
    if (i >= 0) { tiles.splice(i, 1); }
    if (t.el.parentNode) { t.el.parentNode.removeChild(t.el); }
  }

  /**
   * Go not cac the da nhap con dang truot.
   *
   * Goi truoc moi luot va luc onResume: timer bi WebView.onPause chan, quay lai
   * man hinh ma con the cu nam do thi nhin nhu ban co hai o chong nhau.
   */
  function flushPending() {
    for (var i = 0; i < pending.length; i++) {
      var p = pending[i];
      if (p.el.parentNode) { p.el.parentNode.removeChild(p.el); }
      if (p.tile.el.parentNode) {           // the con lai nay len mot cai
        p.tile.el.classList.remove('pop');
        void p.tile.el.offsetWidth;         // ep trinh duyet chay lai keyframes
        p.tile.el.classList.add('pop');
      }
    }
    pending = [];
  }

  /* ---------------- luat choi ---------------- */

  var VEC = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] };

  function move(dir) {
    if (over || !VEC[dir]) { return; }
    flushPending();

    var dr = VEC[dir][0], dc = VEC[dir][1];
    var rs = [0, 1, 2, 3], cs = [0, 1, 2, 3];
    // Di tu phia CUOI theo huong don ve truoc, khong thi mot o don hai lan.
    if (dr > 0) { rs = rs.slice().reverse(); }
    if (dc > 0) { cs = cs.slice().reverse(); }

    var before = snapshotCells();
    var moved = false;
    var gained = 0;

    // Xoa hai lop hoat hinh cu: mot the vua hien ma luot sau lai nhap thi hai
    // keyframes cung an vao transform, o nhay giat mot cai.
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].merged = false;
      tiles[i].el.classList.remove('new', 'pop');
    }

    for (var a = 0; a < N; a++) {
      for (var b = 0; b < N; b++) {
        var r = rs[a], c = cs[b];
        var t = grid[idx(r, c)];
        if (!t) { continue; }

        grid[idx(r, c)] = null;
        var nr = r, nc = c;
        while (inside(nr + dr, nc + dc) && !grid[idx(nr + dr, nc + dc)]) {
          nr += dr; nc += dc;
        }
        var ar = nr + dr, ac = nc + dc;
        var next = inside(ar, ac) ? grid[idx(ar, ac)] : null;

        if (next && next.v === t.v && !next.merged) {
          // Nhap: TRANG THAI doi ngay o day. setTimeout chi go cai the da truot.
          next.v *= 2;
          next.merged = true;
          gained += next.v;
          paint(next);
          if (next.v >= 2048 && !reached) { reached = true; }
          t.r = ar; t.c = ac;
          t.el.style.zIndex = '2';
          place(t);
          var i2 = tiles.indexOf(t);
          if (i2 >= 0) { tiles.splice(i2, 1); }
          pending.push({ el: t.el, tile: next });
          setTimeout(flushPending, ANIM);
          moved = true;
        } else {
          grid[idx(nr, nc)] = t;
          if (nr !== r || nc !== c) {
            t.r = nr; t.c = nc;
            place(t);
            moved = true;
          }
        }
      }
    }

    if (!moved) { return; }

    history.push({ cells: before, score: score, reached: reached });
    if (history.length > HISTORY) { history.shift(); }

    if (gained) { addScore(gained); }
    spawn();
    if (!canMove()) {
      over = true;
      CarGame.over({
        title: 'Hết nước đi',
        note: score + ' điểm',
        sub: (score >= best) ? 'Kỷ lục mới' : ('Cao nhất ' + best),
        again: 'Ván mới',
        onAgain: reset
      });
    }
    render();
  }

  function snapshotCells() {
    var cells = [];
    for (var i = 0; i < N * N; i++) { cells.push(grid[i] ? grid[i].v : 0); }
    return cells;
  }

  function spawn() {
    var free = [];
    for (var i = 0; i < N * N; i++) { if (!grid[i]) { free.push(i); } }
    if (!free.length) { return; }
    var at = free[Math.floor(Math.random() * free.length)];
    addTile(Math.floor(at / N), at % N, Math.random() < 0.9 ? 2 : 4, true);
  }

  function canMove() {
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var t = grid[idx(r, c)];
        if (!t) { return true; }
        if (c + 1 < N && grid[idx(r, c + 1)] && grid[idx(r, c + 1)].v === t.v) { return true; }
        if (r + 1 < N && grid[idx(r + 1, c)] && grid[idx(r + 1, c)].v === t.v) { return true; }
      }
    }
    return false;
  }

  function addScore(n) {
    score += n;
    CarGame.score(score);              // chi goi khi diem DOI
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* rieng tu */ }
    }
  }

  function undo() {
    if (!history.length) { return; }
    CarGame.hideOver();
    flushPending();
    var h = history.pop();
    load(h.cells);
    score = h.score;
    reached = h.reached;
    over = false;
    CarGame.score(score);
    scoreEl.textContent = score;
    render();
  }

  function load(cells) {
    while (tiles.length) { dropTile(tiles[0]); }
    grid = new Array(N * N).fill(null);
    for (var i = 0; i < cells.length; i++) {
      if (cells[i]) { addTile(Math.floor(i / N), i % N, cells[i], false); }
    }
  }

  function reset() {
    CarGame.hideOver();
    flushPending();
    load(new Array(N * N).fill(0));
    history = [];
    score = 0;
    over = false;
    reached = false;
    CarGame.score(0);
    scoreEl.textContent = '0';
    spawn();
    spawn();
    render();
  }

  function render() {
    undoBtn.disabled = !history.length;
    if (CarGame.isPaused()) {
      statusEl.textContent = 'Tạm dừng';
    } else if (over) {
      statusEl.textContent = 'Hết nước đi · ' + score + ' điểm';
    } else if (reached) {
      statusEl.textContent = 'Đạt 2048 — chơi tiếp được';
    } else {
      statusEl.textContent = '';
    }
  }

  /* ---------------- dieu khien ---------------- */

  // Nut huong: duong chac tren xe (khong co ban phim, vuot hay bi doc thanh cham).
  var padButtons = document.querySelectorAll('#pad button[data-dir]');
  for (var p = 0; p < padButtons.length; p++) {
    padButtons[p].addEventListener('click', function (e) {
      move(e.currentTarget.dataset.dir);
    });
  }

  // Vuot.
  var sx = 0, sy = 0, tracking = false;
  board.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  board.addEventListener('touchend', function (e) {
    if (!tracking) { return; }
    tracking = false;
    var t = e.changedTouches[0];
    swipe(t.clientX - sx, t.clientY - sy);
  });
  // Chuot: chi de lam game tren may tinh cho nhanh, tren xe khong dung toi.
  board.addEventListener('mousedown', function (e) { sx = e.clientX; sy = e.clientY; tracking = true; });
  board.addEventListener('mouseup', function (e) {
    if (!tracking) { return; }
    tracking = false;
    swipe(e.clientX - sx, e.clientY - sy);
  });

  function swipe(dx, dy) {
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) { return; }        // duoi nguong nay la cham, khong phai vuot
    move(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }

  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };
  window.addEventListener('keydown', function (e) {
    var dir = KEYS[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  document.getElementById('again').addEventListener('click', reset);
  undoBtn.addEventListener('click', undo);

  var pendingLayout = 0;
  window.addEventListener('resize', function () {
    clearTimeout(pendingLayout);
    pendingLayout = setTimeout(layout, 120);
  });

  // Khong co vong ve nen tam dung chi la bao ra man hinh - nhung phai don not
  // cac the dang truot, vi timer bi chan trong luc man hinh o duoi.
  CarGame.onPause(render);
  CarGame.onResume(function () { flushPending(); render(); });

  /* ---------------- chay ---------------- */

  for (var h = 0; h < N * N; h++) {
    var hole = document.createElement('div');
    hole.className = 'hole';
    gridEl.appendChild(hole);
  }
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;
  layout();
  reset();
}());
</script>
</body>
</html>
